<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Hitung Nilai</title>
</head>
<body>
    <h2>Aplikasi Pengambil Keputusan Nilai</h2>
    <label for="nilai">Masukkan Nilai (0-100): </label>
    <input type="number" id="nilai">
    <button onclick="hitungNilai()">Cek Grade</button>
    
    <p id="hasilGrade"></p>

    <script>
        function hitungNilai() {
            const nilai = parseInt(document.getElementById("nilai").value);
            let hasil = "";

            if (isNaN(nilai)) {
                hasil = "Harap masukkan angka!";
            } else if (nilai >= 0 && nilai <= 20) {
                hasil = "E";
            } else if (nilai >= 21 && nilai <= 40) {
                hasil = "D";
            } else if (nilai >= 41 && nilai <= 60) {
                hasil = "C";
            } else if (nilai >= 61 && nilai <= 80) {
                hasil = "B";
            } else if (nilai >= 81 && nilai <= 100) {
                hasil = "A";
            } else {
                hasil = "Nilai di luar rentang (0-100)";
            }

            document.getElementById("hasilGrade").innerHTML = "<b>Grade Anda: " + hasil + "</b>";
        }
    </script>
</body>
</html>
