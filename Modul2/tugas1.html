<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tugas</title>
</head>
<body>

    <h1>Form Tugas</h1>

    <form action="" method="POST">
        Input 1<br>
        <input type="text" value="Nilai Tetap" readonly><br>
        
        Input 2<br>
        <input type="text" maxlength="5"><br>
        
        Input 3<br>
        <input type="text" disabled><br>
        
        Input 4<br>
        <input type="text" required><br>
        
        Input 5<br>
        <input type="text" pattern="[a-zA-Z0-9]{9}" maxlength="9" required><br>
        
        <input type="submit" value="Submit">
    </form>

</body>
</html>
